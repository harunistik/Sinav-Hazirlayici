<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Oluşturucu</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { 
                // HTML2CANVAS HATASINI ÇÖZEN KRİTİK AYAR: 
                // fontCache 'none' yapılmalı ki resim çekilirken semboller kaybolmasın.
                fontCache: 'none' 
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1200px; 
            transition: max-width 0.3s ease;
        }
        .container.buyuk-mod { max-width: 1800px; }
        h2 { color: #333; text-align: center; margin-top: 0; }
        
        .selections-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .template-selector {
            background-color: #e8f4fd; padding: 15px; border-radius: 4px;
            border-left: 5px solid #007bff; flex: 1;
        }
        .template-selector select {
            width: 100%; padding: 10px; font-size: 16px;
            border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; cursor: pointer;
        }

        .math-toolbar {
            background-color: #f1f3f5; padding: 10px; border-radius: 4px;
            border: 1px solid #ddd; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        }
        .math-toolbar span { font-weight: bold; color: #555; margin-right: 10px; }
        .math-btn {
            background-color: #fff; border: 1px solid #ccc; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; color: #333; transition: background 0.2s;
        }
        .math-btn:hover { background-color: #e2e6ea; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"], textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box; font-size: 16px;
        }
        textarea { resize: vertical; height: 100px; }
        .options-container {
            background-color: #f9f9f9; padding: 15px; border-radius: 4px; border: 1px solid #e0e0e0;
        }
        .option-group { display: flex; align-items: center; margin-bottom: 10px; }
        .option-group label { margin: 0 10px 0 0; width: 20px; }
        
        .btn-primary, .btn-success {
            width: 100%; padding: 15px; color: white; border: none;
            border-radius: 4px; font-size: 18px; cursor: pointer; font-weight: bold;
        }
        .btn-primary { background-color: #007bff; margin-top: 10px; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; margin-top: 15px; }
        .btn-success:hover { background-color: #218838; }
        
        .output-container {
            margin-top: 25px; display: none; flex-direction: column;
            border-top: 2px dashed #ccc; padding-top: 20px; overflow-x: auto;
        }
        .soru-karti {
            padding: 20px; background-color: #ffffff; border: none;
            color: #000; font-size: 55px; line-height: 1.4;
        }
        .soru-karti p { margin-top: 0; }
        .resim-alani { text-align: center; margin-bottom: 30px; display: none; }
        .resim-alani img { max-width: 100%; max-height: 800px; object-fit: contain; }
        
        /* ŞIK DİZİLİMİ CSS KODLARI */
        .soru-karti ul {
            list-style-type: none; padding-left: 0; margin-bottom: 0; margin-top: 40px;
        }
        /* 1. Yan Yana Format */
        .dizilim-yanyana {
            display: flex; justify-content: space-between; width: 100%;
        }
        /* 2. Alt Alta Format */
        .dizilim-altalta {
            display: flex; flex-direction: column; gap: 20px; width: 100%;
        }
        /* 3. İkili (Grid) Format */
        .dizilim-ikili {
            display: grid; grid-template-columns: 1fr 1fr; row-gap: 30px; column-gap: 20px; width: 100%;
        }
        .soru-karti li { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container" id="anaKonteyner">
    <h2>Soru Oluşturucu Aracı</h2>

    <div class="selections-container">
        <div class="template-selector">
            <label for="sablonSecici">Kullanılacak Şablonu Seçiniz:</label>
            <select id="sablonSecici" onchange="arayuzAyarla()">
                <option value="1">Şablon 1: Klasik Çoktan Seçmeli</option>
                <option value="2">Şablon 2: Resimli Çoktan Seçmeli</option>
                <option value="3">Şablon 3: Resimli Dev Format (Tam Genişlik)</option>
            </select>
        </div>
        
        <div class="template-selector" style="border-left-color: #28a745; background-color: #e9f7ef;">
            <label for="dizilimSecici">Şık Dizilimini Seçiniz:</label>
            <select id="dizilimSecici">
                <option value="yanyana">Hepsi Yan Yana (A B C D)</option>
                <option value="altalta">Hepsi Alt Alta</option>
                <option value="ikili">İkili İkili (Üstte A-B, Altta C-D)</option>
            </select>
        </div>
    </div>

    <div class="math-toolbar">
        <span>Matematik:</span>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\frac{}{}$', 7)">Kesir (a/b)</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$x^{}$', 4)">Üslü (x²)</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\sqrt{}$', 7)">Kök (√x)</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\times$', 8)">×</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\div$', 6)">÷</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\pm$', 5)">±</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\pi$', 5)">π</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\infty$', 9)">∞</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\leq$', 6)">≤</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\geq$', 6)">≥</button>
        <button type="button" class="math-btn" onclick="formuleEkle('$\\degree$', 9)">Derece (°)</button>
    </div>
    
    <div class="form-group">
        <label for="aciklama">Açıklama / Metin:</label>
        <textarea id="aciklama" class="math-input" placeholder="Yazmaya başlamak için tıklayın..."></textarea>
    </div>

    <div class="form-group" id="resimYuklemeKismi" style="display: none;">
        <label for="soruResmi">Soru Görseli (İsteğe Bağlı):</label>
        <input type="file" id="soruResmi" accept="image/png, image/jpeg, image/jpg" onchange="resimOnizle(event)">
    </div>

    <div class="form-group">
        <label for="soruKoku">Soru Kökü:</label>
        <input type="text" id="soruKoku" class="math-input" placeholder="Yazmaya başlamak için tıklayın...">
    </div>

    <div class="options-container">
        <label>Şıklar (4 Seçenek):</label>
        <div class="option-group"><label>A)</label> <input type="text" id="sikA" class="math-input" placeholder="A şıkkı"></div>
        <div class="option-group"><label>B)</label> <input type="text" id="sikB" class="math-input" placeholder="B şıkkı"></div>
        <div class="option-group"><label>C)</label> <input type="text" id="sikC" class="math-input" placeholder="C şıkkı"></div>
        <div class="option-group"><label>D)</label> <input type="text" id="sikD" class="math-input" placeholder="D şıkkı"></div>
    </div>

    <button class="btn-primary" onclick="soruyuOlustur()">Soruyu Oluştur</button>

    <div class="output-container" id="ciktiAlani">
        <div class="soru-karti" id="soruKarti">
            <p id="onizlemeAciklama" style="font-style: italic; margin-bottom: 30px;"></p>
            <div class="resim-alani" id="onizlemeResimAlani">
                <img id="onizlemeResim" src="" alt="Soru Görseli">
            </div>
            <p id="onizlemeSoru" style="font-weight: bold; margin-bottom: 30px;"></p>
            <ul id="onizlemeSiklar"></ul>
        </div>
        <button class="btn-success" onclick="resimOlarakIndir()">PNG Olarak İndir</button>
    </div>
</div>

<script>
    let yuklenenResimVerisi = "";
    let sonOdaklanilanGirdi = null;

    document.querySelectorAll('.math-input').forEach(input => {
        input.addEventListener('focus', function() {
            sonOdaklanilanGirdi = this;
        });
    });

    function formuleEkle(eklenecekMetin, imlecPozisyonu) {
        if (!sonOdaklanilanGirdi) {
            alert("Lütfen önce formül eklemek istediğiniz kutuya tıklayın.");
            return;
        }

        const girdi = sonOdaklanilanGirdi;
        const baslangic = girdi.selectionStart;
        const bitis = girdi.selectionEnd;
        const mevcutMetin = girdi.value;

        girdi.value = mevcutMetin.substring(0, baslangic) + eklenecekMetin + mevcutMetin.substring(bitis);
        girdi.selectionStart = girdi.selectionEnd = baslangic + imlecPozisyonu;
        girdi.focus();
    }

    function arayuzAyarla() {
        const secilen = document.getElementById('sablonSecici').value;
        const konteyner = document.getElementById('anaKonteyner');
        
        document.getElementById('resimYuklemeKismi').style.display = (secilen === "2" || secilen === "3") ? 'block' : 'none';
        if (secilen === "3") { konteyner.classList.add('buyuk-mod'); } 
        else { konteyner.classList.remove('buyuk-mod'); }
        document.getElementById('ciktiAlani').style.display = 'none';
    }

    function resimOnizle(event) {
        const dosya = event.target.files[0];
        if (dosya) {
            const okuyucu = new FileReader();
            okuyucu.onload = e => yuklenenResimVerisi = e.target.result;
            okuyucu.readAsDataURL(dosya);
        }
    }

    function soruyuOlustur() {
        const sablon = document.getElementById('sablonSecici').value;
        const dizilim = document.getElementById('dizilimSecici').value;
        
        document.getElementById('ciktiAlani').style.display = 'flex';
        
        document.getElementById('onizlemeAciklama').innerText = document.getElementById('aciklama').value;
        document.getElementById('onizlemeSoru').innerText = document.getElementById('soruKoku').value;
        
        const resimKutusu = document.getElementById('onizlemeResimAlani');
        if ((sablon === "2" || sablon === "3") && yuklenenResimVerisi) {
            document.getElementById('onizlemeResim').src = yuklenenResimVerisi;
            resimKutusu.style.display = 'block';
        } else {
            resimKutusu.style.display = 'none';
        }
        
        // Şıkların dizilimini ayarlayan CSS sınıfını ekliyoruz
        const ulElementi = document.getElementById('onizlemeSiklar');
        ulElementi.className = ''; // Eski sınıfları temizle
        ulElementi.classList.add('dizilim-' + dizilim);
        
        ulElementi.innerHTML = `
            <li><strong>A)</strong> <span>${document.getElementById('sikA').value}</span></li>
            <li><strong>B)</strong> <span>${document.getElementById('sikB').value}</span></li>
            <li><strong>C)</strong> <span>${document.getElementById('sikC').value}</span></li>
            <li><strong>D)</strong> <span>${document.getElementById('sikD').value}</span></li>
        `;

        // Matematik formüllerini tetikle
        if (window.MathJax) {
            MathJax.typesetPromise([document.getElementById('soruKarti')]).catch(function (err) {
                console.log('MathJax Dönüştürme Hatası: ', err.message);
            });
        }
    }

    function resimOlarakIndir() {
        const sablon = document.getElementById('sablonSecici').value;
        const kaliteOrani = (sablon === "3") ? 4 : 3;

        html2canvas(document.getElementById('soruKarti'), { 
            backgroundColor: "#ffffff", 
            scale: kaliteOrani 
        }).then(canvas => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL("image/png");
            link.download = `soru.png`;
            link.click();
        });
    }
</script>
</body>
</html>
