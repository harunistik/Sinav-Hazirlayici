<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Kağıdı Hazırlayıcı - Kusursuz Tam Sayfa</title>
    <style>
        :root {
            --soru-bosluk: 1.5cm;
        }

        /* --- Arayüz Ayarları --- */
        body { font-family: Arial, sans-serif; background-color: #444; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; width: 100%; max-width: 900px; position: sticky; top: 10px; z-index: 1000; }
        .controls input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 160px; }
        .controls input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 60px; }
        .controls .setting-group { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 13px; color: #333; }
        
        /* Dosya Yükleme Alanları */
        .upload-group { display: flex; flex-direction: column; gap: 5px; background: #f8f9fa; border: 1px dashed #adb5bd; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .upload-group input { font-size: 12px; cursor: pointer; }
        .upload-group.full-page { border-color: #f38220; background: #fff4ec; } 

        .controls button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .controls button:hover { background-color: #0056b3; }
        .controls .clear-btn { background-color: #dc3545; }
        .controls .clear-btn:hover { background-color: #c82333; }
        #loadingIndicator { display: none; color: #f38220; font-weight: bold; margin-left: 10px; }

        /* --- Sınav Kağıdı Konteyneri --- */
        #examContainer { display: flex; flex-direction: column; gap: 40px; width: 210mm; }

        .paper { background: white; width: 210mm; height: 297mm; max-height: 297mm; padding: 15mm 15mm 10mm 15mm; box-shadow: 0 0 15px rgba(0,0,0,0.5); box-sizing: border-box; display: flex; flex-direction: column; position: relative; margin: 0 auto; overflow: hidden; }
        
        /* Başlık Kutusu */
        .header-box { border: 2px solid #f38220; border-radius: 12px; overflow: hidden; margin-bottom: 8mm; flex-shrink: 0; }
        .header-top { background-color: #f38220; padding: 6px; text-align: center; }
        .header-top h1 { margin: 0; font-size: 16px; font-weight: bold; color: black; }
        
        /* Alt Başlık */
        .header-bottom { padding: 8px 15px; background-color: white; display: flex; justify-content: space-between; align-items: center; }
        .header-bottom .student-info { font-size: 14px; font-weight: bold; color: #000; }
        .header-bottom .creator-info p { margin: 0; font-size: 14px; font-weight: bold; color: #000; text-align: right; }

        /* --- SÜTUN MİMARİSİ --- */
        .content-wrapper { flex: 1; display: flex; position: relative; height: 100%; max-height: 100%; }
        
        .wrapper-normal::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; background-color: #f38220; transform: translateX(-50%); z-index: 1; }
        .wrapper-full::after { display: none; }

        .column { height: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
        .left-column { width: 50%; padding-right: 10mm; box-sizing: border-box; }
        .right-column { width: 50%; padding-left: 10mm; box-sizing: border-box; }
        .full-column { width: 100%; padding: 0 5mm; box-sizing: border-box; } 

        /* --- SORU DÜZENLERİ --- */
        .question-item { 
            margin-bottom: var(--soru-bosluk); 
            display: flex; 
            align-items: flex-start; 
            gap: 8px; 
            flex-shrink: 0; 
        }

        /* YENİ: Tam Sayfa Sorular İçin Ekstra Boşluk Sınırı */
        /* Normal boşluğa 2.5cm daha ekler, böylece genel boşluk ayarını bozmadan ferahlık sağlar */
        .layout-full .question-item {
            margin-bottom: calc(var(--soru-bosluk) + 2.5cm);
        }
        
        .q-side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 25px; padding-top: 2px; }
        .question-number { font-weight: bold; font-size: 14px; }
        .delete-btn { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 5px; cursor: pointer; font-size: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .delete-btn:hover { background: #c82333; transform: scale(1.1); }

        .question-image { flex: 1; }
        .question-image img { max-width: 100%; max-height: 220mm; object-fit: contain; display: block; }
        .layout-full .question-image img { max-height: 120mm; }

        /* Alt Bilgi */
        .footer { border-top: 1.5px solid #f38220; position: relative; margin-top: auto; padding-top: 10px; text-align: center; flex-shrink: 0; z-index: 2; }
        .page-number { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: white; border: 1.5px solid #f38220; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #f38220; font-size: 14px; z-index: 3; }

        @media print {
            body { background: white; margin: 0; padding: 0; align-items: flex-start; }
            .no-print { display: none !important; }
            #examContainer { gap: 0; }
            .paper { box-shadow: none; margin: 0; width: 210mm; height: 297mm; page-break-after: always; }
            .paper:last-child { page-break-after: auto; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <input type="text" id="examTitle" placeholder="Üst Başlık (Örn: 6.SINIF 2.DENEME)">
        <input type="text" id="creatorName" placeholder="Sağ Alt Bilgi (Örn: HLT Matematik)">
        
        <div class="setting-group">
            Boşluk(cm): <input type="number" id="spacingInput" value="1.5" step="0.5" min="0">
        </div>

        <div class="upload-group">
            <label>Normal Soru Ekle (2 Sütun):</label>
            <input type="file" id="imageUploader" multiple accept="image/png, image/jpeg, image/jpg">
        </div>

        <div class="upload-group full-page">
            <label style="color: #d66f15;">Tam Sayfa Soru Ekle (1 Sütun - Max 2):</label>
            <input type="file" id="fullImageUploader" multiple accept="image/png, image/jpeg, image/jpg">
        </div>

        <button onclick="window.print()" style="background-color: #f38220;">PDF Çıktı Al</button>
        <button class="clear-btn" onclick="clearAll()">Tümünü Temizle</button>
        <span id="loadingIndicator">İşleniyor...</span>
    </div>

    <div id="examContainer"></div>

    <script>
        let uploadedImages = []; 
        let currentPage = 1;
        let currentPageType = 'normal'; 
        let currentSide = 'left'; 
        let isProcessing = false;

        window.onload = () => {
            document.getElementById('examContainer').appendChild(createPage(1, 'normal'));
        };

        function createPage(pageNum, layoutType = 'normal') {
            const title = document.getElementById('examTitle').value || '6.SINIF 2.DENEME';
            const creator = document.getElementById('creatorName').value || 'HLT Matematik';
            const page = document.createElement('div');
            page.className = `paper layout-${layoutType}`;
            page.id = `page-${pageNum}`;
            
            let headerBottomHtml = '';
            if (pageNum === 1) {
                headerBottomHtml = `
                    <div class="header-bottom">
                        <div class="student-info">Ad - Soyad: </div>
                        <div class="creator-info"><p class="displayCreator">${creator}</p></div>
                    </div>
                `;
            }
            
            let columnsHtml = '';
            if (layoutType === 'normal') {
                columnsHtml = `
                    <div class="column left-column" id="page-${pageNum}-left"></div>
                    <div class="column right-column" id="page-${pageNum}-right"></div>
                `;
            } else {
                columnsHtml = `
                    <div class="column full-column" id="page-${pageNum}-full"></div>
                `;
            }
            
            page.innerHTML = `
                <div class="header-box">
                    <div class="header-top"><h1 class="displayTitle">${title}</h1></div>
                    ${headerBottomHtml}
                </div>
                <div class="content-wrapper wrapper-${layoutType}">
                    ${columnsHtml}
                </div>
                <div class="footer"><div class="page-number">${pageNum}</div></div>
            `;
            return page;
        }

        document.getElementById('imageUploader').addEventListener('change', (e) => handleUpload(e, 'normal'));
        document.getElementById('fullImageUploader').addEventListener('change', (e) => handleUpload(e, 'full'));

        async function handleUpload(e, layoutType) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            toggleUI(true); 

            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    const imgSrc = await readFileAsDataURL(file);
                    uploadedImages.push({ src: imgSrc, layout: layoutType }); 
                }
            }
            e.target.value = ''; 
            await reRenderExam(); 
            toggleUI(false);
        }

        function readFileAsDataURL(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function deleteQuestion(index) {
            if(isProcessing) return; 
            uploadedImages.splice(index, 1);
            reRenderExam();
        }

        let spacingTimeout;
        document.getElementById('spacingInput').addEventListener('input', function(e) {
            const gap = e.target.value || 0;
            document.documentElement.style.setProperty('--soru-bosluk', gap + 'cm');
            if(uploadedImages.length === 0) return;
            clearTimeout(spacingTimeout);
            spacingTimeout = setTimeout(() => { reRenderExam(); }, 500); 
        });

        async function reRenderExam() {
            if(isProcessing) return;
            isProcessing = true;
            document.getElementById('loadingIndicator').style.display = 'inline';

            document.getElementById('examContainer').innerHTML = '';
            currentPage = 1;
            
            currentPageType = uploadedImages.length > 0 ? uploadedImages[0].layout : 'normal';
            currentSide = currentPageType === 'normal' ? 'left' : 'full';
            
            document.getElementById('examContainer').appendChild(createPage(1, currentPageType));

            for (let i = 0; i < uploadedImages.length; i++) {
                await placeQuestionInDOM(i);
            }

            document.getElementById('loadingIndicator').style.display = 'none';
            isProcessing = false;
        }

        async function placeQuestionInDOM(index) {
            const qData = uploadedImages[index];
            const imgSrc = qData.src;
            const targetLayout = qData.layout; 
            const qNum = index + 1;

            await new Promise(resolve => {
                const tempImg = new Image();
                tempImg.onload = resolve;
                tempImg.src = imgSrc;
            });

            let placed = false;

            while (!placed) {
                if (currentPageType !== targetLayout) {
                    const wrapper = document.querySelector(`#page-${currentPage} .content-wrapper`);
                    const hasItems = wrapper && wrapper.querySelectorAll('.question-item').length > 0;
                    
                    if (hasItems) {
                        currentPage++;
                    } else {
                        const oldPage = document.getElementById(`page-${currentPage}`);
                        if(oldPage) oldPage.remove();
                    }
                    
                    currentPageType = targetLayout;
                    currentSide = targetLayout === 'normal' ? 'left' : 'full';
                    
                    if (!document.getElementById(`page-${currentPage}`)) {
                        document.getElementById('examContainer').appendChild(createPage(currentPage, currentPageType));
                    }
                }

                let targetColumn = document.getElementById(`page-${currentPage}-${currentSide}`);
                
                if (!targetColumn) {
                    document.getElementById('examContainer').appendChild(createPage(currentPage, currentPageType));
                    targetColumn = document.getElementById(`page-${currentPage}-${currentSide}`);
                }

                const qDiv = document.createElement('div');
                qDiv.className = `question-item`;
                qDiv.innerHTML = `
                    <div class="q-side">
                        <span class="question-number">${qNum}.</span>
                        <button class="delete-btn no-print" onclick="deleteQuestion(${index})" title="Bu soruyu sil">🗑️</button>
                    </div>
                    <div class="question-image"><img src="${imgSrc}"></div>
                `;

                targetColumn.appendChild(qDiv);

                await new Promise(r => setTimeout(r, 20));

                if (currentPageType === 'full' && targetColumn.children.length > 2) {
                    targetColumn.removeChild(qDiv);
                    advancePagePointer(currentPageType);
                    continue; 
                }

                const colRect = targetColumn.getBoundingClientRect();
                const qRect = qDiv.getBoundingClientRect();
                const style = window.getComputedStyle(qDiv);
                const marginBottom = parseFloat(style.marginBottom) || 0;

                if ((qRect.bottom + marginBottom) > colRect.bottom + 5) {
                    if (targetColumn.children.length === 1) {
                        placed = true;
                        advancePagePointer(currentPageType);
                    } else {
                        targetColumn.removeChild(qDiv); 
                        advancePagePointer(currentPageType); 
                    }
                } else {
                    placed = true; 
                }
            }
        }

        function advancePagePointer(layout) {
            if (layout === 'normal') {
                if (currentSide === 'left') {
                    currentSide = 'right'; 
                } else {
                    currentPage++; 
                    currentSide = 'left';
                    document.getElementById('examContainer').appendChild(createPage(currentPage, layout));
                }
            } else if (layout === 'full') {
                currentPage++;
                currentSide = 'full';
                document.getElementById('examContainer').appendChild(createPage(currentPage, layout));
            }
        }

        function toggleUI(disable) {
            document.getElementById('imageUploader').disabled = disable;
            document.getElementById('fullImageUploader').disabled = disable;
            document.getElementById('spacingInput').disabled = disable;
        }

        document.getElementById('examTitle').addEventListener('input', function(e) {
            const val = e.target.value || '6.SINIF 2.DENEME';
            document.querySelectorAll('.displayTitle').forEach(el => el.innerText = val);
        });

        document.getElementById('creatorName').addEventListener('input', function(e) {
            const val = e.target.value || 'HLT Matematik';
            document.querySelectorAll('.displayCreator').forEach(el => el.innerText = val);
        });

        function clearAll() {
            uploadedImages = []; 
            currentPage = 1;
            currentPageType = 'normal';
            currentSide = 'left';
            document.getElementById('examContainer').innerHTML = '';
            document.getElementById('examContainer').appendChild(createPage(1, 'normal'));
        }
    </script>

</body>
</html>
